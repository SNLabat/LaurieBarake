<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laurie Barake — Watercolor Artist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #faf9f7;
      --surface: #f4f2ee;
      --border: #e8e4dd;
      --text: #2a2620;
      --muted: #8c8580;
      --accent: #6b5e52;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      line-height: 1.6;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0 clamp(1.5rem, 5vw, 4rem);
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: 1.35rem;
      letter-spacing: 0.04em;
      color: var(--text);
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 2.5rem;
    }

    nav a {
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    nav a:hover { color: var(--text); }

    /* ── Hero ── */
    .hero {
      padding: clamp(4rem, 10vw, 7rem) clamp(1.5rem, 5vw, 4rem);
      max-width: 640px;
    }

    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(2.8rem, 6vw, 4.5rem);
      line-height: 1.1;
      letter-spacing: -0.01em;
      margin-bottom: 1.25rem;
    }

    .hero h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .hero p {
      font-size: 1rem;
      color: var(--muted);
      max-width: 420px;
    }

    /* ── Section shared ── */
    section {
      padding: clamp(3rem, 8vw, 5.5rem) clamp(1.5rem, 5vw, 4rem);
    }

    .section-label {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(1.6rem, 3.5vw, 2.4rem);
      margin-bottom: 2.5rem;
      color: var(--text);
    }

    /* ── Featured ── */
    #featured {
      border-top: 1px solid var(--border);
    }

    .featured-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .featured-card {
      cursor: pointer;
      position: relative;
      overflow: hidden;
      border-radius: 2px;
      background: var(--surface);
      aspect-ratio: 1 / 1;
    }

    .featured-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.3s;
    }

    .featured-card:hover img {
      transform: scale(1.04);
      opacity: 0.92;
    }

    .featured-card .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(30,25,20,0.45) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.3s;
      display: flex;
      align-items: flex-end;
      padding: 1.25rem;
    }

    .featured-card:hover .overlay { opacity: 1; }

    .overlay-text {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.05rem;
      color: #fff;
      letter-spacing: 0.02em;
    }

    /* ── Gallery ── */
    #gallery {
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    .gallery-item {
      cursor: pointer;
      overflow: hidden;
      border-radius: 2px;
      background: var(--border);
      aspect-ratio: 1 / 1;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.3s;
    }

    .gallery-item:hover img {
      transform: scale(1.06);
      opacity: 0.88;
    }

    /* ── Lightbox ── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(20, 17, 14, 0.93);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 2rem;
      cursor: zoom-out;
    }

    #lightbox.open { display: flex; }

    #lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5);
      cursor: default;
    }

    .lb-close {
      position: fixed;
      top: 1.25rem;
      right: 1.5rem;
      font-size: 1.5rem;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      background: none;
      border: none;
      line-height: 1;
      transition: color 0.2s;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
    }

    .lb-close:hover { color: #fff; }

    .lb-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.6rem;
      color: rgba(255,255,255,0.5);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.5rem 1rem;
      transition: color 0.2s;
      user-select: none;
    }

    .lb-nav:hover { color: rgba(255,255,255,0.9); }
    .lb-prev { left: 0.5rem; }
    .lb-next { right: 0.5rem; }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 2.5rem clamp(1.5rem, 5vw, 4rem);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .footer-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      color: var(--muted);
    }

    .footer-copy {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      nav { display: none; }
      .featured-grid { grid-template-columns: 1fr 1fr; gap: 0.75rem; }
      .gallery-grid { grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="#" class="logo">Laurie Barake</a>
    <nav>
      <a href="#featured">Featured</a>
      <a href="#gallery">Gallery</a>
    </nav>
  </header>

  <!-- Hero -->
  <div class="hero">
    <h1>Painting the world<br/>in <em>watercolor</em></h1>
    <p>Original watercolor works by Laurie Barake — exploring color, light, and the quiet beauty of everyday moments.</p>
  </div>

  <!-- Featured Works -->
  <section id="featured">
    <p class="section-label">Selected works</p>
    <h2 class="section-title">Featured</h2>
    <div class="featured-grid" id="featured-grid">
      <!-- injected by JS -->
    </div>
  </section>

  <!-- Full Gallery -->
  <section id="gallery">
    <p class="section-label">All works</p>
    <h2 class="section-title">Gallery</h2>
    <div class="gallery-grid" id="gallery-grid">
      <!-- injected by JS -->
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <span class="footer-name">Laurie Barake</span>
    <span class="footer-copy">Watercolor Artist &nbsp;&middot;&nbsp; All rights reserved</span>
  </footer>

  <!-- Lightbox -->
  <div id="lightbox" role="dialog" aria-modal="true">
    <button class="lb-close" aria-label="Close">&times;</button>
    <button class="lb-nav lb-prev" aria-label="Previous">&#8592;</button>
    <img id="lb-img" src="" alt="Artwork" />
    <button class="lb-nav lb-next" aria-label="Next">&#8594;</button>
  </div>

  <script>
    // ── Image lists ──
    const featured = [
      "Featured/IMG_2356.jpeg",
      "Featured/IMG_2357.jpeg",
      "Featured/IMG_2393.jpeg",
      "Featured/IMG_2463.jpeg",
    ];

    const gallery = [
      "Gallery/IMG_2356.jpeg",
      "Gallery/IMG_2357.jpeg",
      "Gallery/IMG_2364.jpeg",
      "Gallery/IMG_2365.jpeg",
      "Gallery/IMG_2366.jpeg",
      "Gallery/IMG_2368.jpeg",
      "Gallery/IMG_2369.jpeg",
      "Gallery/IMG_2370.jpeg",
      "Gallery/IMG_2371.jpeg",
      "Gallery/IMG_2379.jpeg",
      "Gallery/IMG_2380.jpeg",
      "Gallery/IMG_2381.jpeg",
      "Gallery/IMG_2382.jpeg",
      "Gallery/IMG_2383.png",
      "Gallery/IMG_2384.png",
      "Gallery/IMG_2388.png",
      "Gallery/IMG_2393.jpeg",
      "Gallery/IMG_2406.png",
      "Gallery/IMG_2428.png",
      "Gallery/IMG_2429.png",
      "Gallery/IMG_2430.png",
      "Gallery/IMG_2431.png",
      "Gallery/IMG_2432.png",
      "Gallery/IMG_2434.jpeg",
      "Gallery/IMG_2437.png",
      "Gallery/IMG_2438.jpeg",
      "Gallery/IMG_2440.jpeg",
      "Gallery/IMG_2442.jpeg",
      "Gallery/IMG_2443.jpeg",
      "Gallery/IMG_2444.jpeg",
      "Gallery/IMG_2446.jpeg",
      "Gallery/IMG_2447.jpeg",
      "Gallery/IMG_2450.jpeg",
      "Gallery/IMG_2451.jpeg",
      "Gallery/IMG_2453.jpeg",
      "Gallery/IMG_2457.jpeg",
      "Gallery/IMG_2458.jpeg",
      "Gallery/IMG_2462.jpeg",
      "Gallery/IMG_2463.jpeg",
      "Gallery/IMG_2464.jpeg",
      "Gallery/IMG_2465.jpeg",
      "Gallery/IMG_2466.jpeg",
      "Gallery/IMG_2467.jpeg",
      "Gallery/IMG_2469.jpeg",
      "Gallery/IMG_2470.jpeg",
      "Gallery/IMG_2471.jpeg",
      "Gallery/IMG_2472.jpeg",
      "Gallery/IMG_2477.jpeg",
      "Gallery/IMG_2479.jpeg",
      "Gallery/IMG_2480.jpeg",
      "Gallery/IMG_2481.jpeg",
      "Gallery/IMG_2482.jpeg",
      "Gallery/IMG_2483.jpeg",
      "Gallery/IMG_2485.jpeg",
      "Gallery/IMG_2486.jpeg",
      "Gallery/IMG_2492.jpeg",
    ];

    // ── Render featured ──
    const fgrid = document.getElementById("featured-grid");
    featured.forEach((src, i) => {
      const card = document.createElement("div");
      card.className = "featured-card";
      card.innerHTML = `
        <img src="${src}" alt="Featured artwork ${i + 1}" loading="lazy" />
        <div class="overlay"></div>
      `;
      card.addEventListener("click", () => openLightbox(gallery, i, featured));
      fgrid.appendChild(card);
    });

    // ── Render gallery ──
    const ggrid = document.getElementById("gallery-grid");
    gallery.forEach((src, i) => {
      const item = document.createElement("div");
      item.className = "gallery-item";
      item.innerHTML = `<img src="${src}" alt="Gallery artwork ${i + 1}" loading="lazy" />`;
      item.addEventListener("click", () => openLightbox(gallery, i));
      ggrid.appendChild(item);
    });

    // ── Lightbox ──
    const lb = document.getElementById("lightbox");
    const lbImg = document.getElementById("lb-img");
    let lbImages = [];
    let lbIndex = 0;

    function openLightbox(images, index, alt) {
      lbImages = images;
      lbIndex = index;
      lbImg.src = images[index];
      lb.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      lb.classList.remove("open");
      document.body.style.overflow = "";
      lbImg.src = "";
    }

    function navigate(dir) {
      lbIndex = (lbIndex + dir + lbImages.length) % lbImages.length;
      lbImg.src = "";
      setTimeout(() => { lbImg.src = lbImages[lbIndex]; }, 30);
    }

    document.querySelector(".lb-close").addEventListener("click", closeLightbox);
    document.querySelector(".lb-prev").addEventListener("click", (e) => { e.stopPropagation(); navigate(-1); });
    document.querySelector(".lb-next").addEventListener("click", (e) => { e.stopPropagation(); navigate(1); });

    lb.addEventListener("click", (e) => {
      if (e.target === lb) closeLightbox();
    });

    document.addEventListener("keydown", (e) => {
      if (!lb.classList.contains("open")) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") navigate(-1);
      if (e.key === "ArrowRight") navigate(1);
    });
  </script>

</body>
</html>
